# Render Blueprint. Set OPENAI_API_KEY in the dashboard after creation.
# Free plan has no persistent disk: decisions reset on restart, and the sample data re-seeds.
services:
  - type: web
    name: kenpath-officer-console
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
